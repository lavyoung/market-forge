name: market-forge-external

services:
  api:
    build:
      context: ../..
      dockerfile: docs/docker/backend.Dockerfile
    image: market-forge-api:${IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080

      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-0.1}

      JAVA_OPTS: >-
        -XX:MaxRAMPercentage=75.0
        -XX:+ExitOnOutOfMemoryError
        -Dfile.encoding=UTF-8
        -Duser.timezone=Asia/Shanghai
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent http://127.0.0.1:8080/actuator/health >/dev/null"
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    expose:
      - "8080"
    networks:
      - backend

  web:
    build:
      context: ../..
      dockerfile: docs/docker/web.Dockerfile
    image: market-forge-web:${IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      MARKET_FORGE_API_BASE_URL: http://api:8080
      DEMO_RAFFLE_ENABLED: ${DEMO_RAFFLE_ENABLED:-false}
      DEMO_RAFFLE_USER_ID: ${DEMO_RAFFLE_USER_ID:-demo-user-001}
      HOSTNAME: 0.0.0.0
      PORT: 3000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    expose:
      - "3000"
    networks:
      - frontend
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      web:
        condition: service_healthy
    networks:
      - frontend

networks:
  frontend:
  backend: