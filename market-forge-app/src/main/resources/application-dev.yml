server:
  port: 23001

spring:
  application:
    name: market-forge-dev

  data:
    redis:
      host: ${MARKET_FORGE_REDIS_HOST:192.168.3.127}
      port: ${MARKET_FORGE_REDIS_PORT:6379}
      password: ${MARKET_FORGE_REDIS_PASSWORD:sYogkA6cjqyZBwuI+5bE7AFTWKtVvBQs}

  rabbitmq:
    addresses: ${MARKET_FORGE_MQ_HOST:192.168.3.127}
    port: ${MARKET_FORGE_MQ_PORT:5672}
    username: ${MARKET_FORGE_MQ_USER_NAME:dev}
    password: ${MARKET_FORGE_MQ_PASSWORD:T83fMSTI6OeQMLYvvpTH9ZPTGXVtwyGh}
    publisher-confirm-type: correlated   # broker 用 CorrelationData 关联确认结果
    publisher-returns: true              # 不可路由的消息退回给发布端
    listener:
      simple:
        acknowledge-mode: auto          # 方法正常返回=ack；抛异常=nack（交给 retry 处理）
        prefetch: 10                    # 每个消费者最多预取 10 条未确认消息
        concurrency: 2                  # 初始并发消费者数
        max-concurrency: 4              # 峰值并发
        default-requeue-rejected: false # 重试耗尽后不重回队列 —— 关键！
        retry:
          enabled: true
          max-attempts: 3               # 总共尝试 3 次（含首次）
          initial-interval: 100ms
          multiplier: 2.0
          max-interval: 10s

lavshard:
  enabled: true

  integration:
    # 普通表固定访问 market-forge-001
    default-data-source: ds1

    # 只有这些 Mapper namespace 才交给 LavShard 管理
    managed-mapper-packages:
      - com.lavyoung.marketforge.infrastructure.persistent.dao

    # 配置类、规则类和活动定义类表，不按照用户分片
    ordinary-tables:
      - award
      - strategy
      - strategy_award
      - strategy_rule
      - rule_tree
      - rule_tree_node
      - rule_tree_node_line
      - raffle_activity
      - raffle_activity_count
      - raffle_activity_sku
      - task

  data-sources:
    ds1:
      managed:
        url: jdbc:mysql://${MARKET_FORGE_DB_HOST:192.168.3.127}:3306/market-forge-001?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
        username: ${MARKET_FORGE_DB_USERNAME:dev}
        password: ${MARKET_FORGE_DB_PASSWORD:Fssm76GKB}
        driver-class-name: com.mysql.cj.jdbc.Driver
        maximum-pool-size: 50
        minimum-idle: 20
        connection-timeout: 30000

    ds2:
      managed:
        url: jdbc:mysql://${MARKET_FORGE_DB_HOST:192.168.3.127}:3306/market-forge-002?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
        username: ${MARKET_FORGE_DB_USERNAME:dev}
        password: ${MARKET_FORGE_DB_PASSWORD:Fssm76GKB}
        driver-class-name: com.mysql.cj.jdbc.Driver
        maximum-pool-size: 50
        minimum-idle: 20
        connection-timeout: 30000

  defaults:
    layout: database-only

  layouts:
    database-only:
      # 属于持久化路由契约，数据产生后不要随意修改
      version: market-forge-database-v1

      # 顺序也是路由契约的一部分
      data-source-ids:
        - ds1
        - ds2

      # 每个数据库中只有一张同名物理表
      tables-per-data-source: 1

      # 这是逻辑桶数量，不代表创建 1024 张表
      bucket-count: 1024

      # 纯分库，不改写表名
      table-suffix:
        enabled: false

  tables:
    # 以下业务表统一按照 user_id 路由，同一用户的数据进入同一个数据库。
    raffle_activity_order:
      sharding-column: user_id

    raffle_activity_account:
      sharding-column: user_id

    raffle_activity_account_day:
      sharding-column: user_id

    raffle_activity_account_month:
      sharding-column: user_id

    user_award_record:
      sharding-column: user_id

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
  packages-to-scan:
    - com.lavyoung.marketforge.trigger.controller

management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0
    propagation:
      type:
        - w3c

logging:
  level:
    com.lavyoung.marketforge: debug
    io.github.lavyoung.lavshard: debug
