server:
  port: 23001
  servlet:
    session:
      cookie:
        # 本地开发使用 HTTP，开启 Secure 后浏览器不会回传 Cookie。
        secure: false

spring:
  application:
    name: market-forge-dev

  data:
    redis:
      host: ${MARKET_FORGE_REDIS_HOST:192.168.3.127}
      port: ${MARKET_FORGE_REDIS_PORT:6379}
      password: ${MARKET_FORGE_REDIS_PASSWORD:sYogkA6cjqyZBwuI+5bE7AFTWKtVvBQs}
      database: 0

  rabbitmq:
    addresses: ${MARKET_FORGE_MQ_HOST:192.168.3.127}
    port: ${MARKET_FORGE_MQ_PORT:5672}
    username: ${MARKET_FORGE_MQ_USER_NAME:dev}
    password: ${MARKET_FORGE_MQ_PASSWORD:T83fMSTI6OeQMLYvvpTH9ZPTGXVtwyGh}
    publisher-confirm-type: correlated   # broker 用 CorrelationData 关联确认结果
    publisher-returns: true              # 不可路由的消息退回给发布端
    listener:
      simple:
        acknowledge-mode: auto          # 方法正常返回=ack；抛异常=nack（交给 retry 处理）
        prefetch: 10                    # 每个消费者最多预取 10 条未确认消息
        concurrency: 2                  # 初始并发消费者数
        max-concurrency: 4              # 峰值并发
        default-requeue-rejected: false # 重试耗尽后不重回队列 —— 关键！
        retry:
          enabled: true
          max-attempts: 3               # 总共尝试 3 次（含首次）
          initial-interval: 100ms
          multiplier: 2.0
          max-interval: 10s

lavshard:
  enabled: true

  integration:
    # 普通表固定访问 market-forge-001
    default-data-source: ds1

    # 只有这些 Mapper namespace 才交给 LavShard 管理
    managed-mapper-packages:
      - com.lavyoung.marketforge.infrastructure.persistent.dao

    # 配置类、规则类和活动定义类表，不按照用户分片
    ordinary-tables:
      - award
      - strategy
      - strategy_award
      - strategy_rule
      - rule_tree
      - rule_tree_node
      - rule_tree_node_line
      - raffle_activity
      - raffle_activity_count
      - raffle_activity_sku
      - processed_message
      - behavior_rebate_config

  data-sources:
    ds1:
      managed:
        url: jdbc:mysql://${MARKET_FORGE_DB_HOST:192.168.3.127}:3306/market-forge-001?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
        username: ${MARKET_FORGE_DB_USERNAME:dev}
        password: ${MARKET_FORGE_DB_PASSWORD:Fssm76GKB}
        driver-class-name: com.mysql.cj.jdbc.Driver
        maximum-pool-size: 50
        minimum-idle: 20
        connection-timeout: 30000

    ds2:
      managed:
        url: jdbc:mysql://${MARKET_FORGE_DB_HOST:192.168.3.127}:3306/market-forge-002?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
        username: ${MARKET_FORGE_DB_USERNAME:dev}
        password: ${MARKET_FORGE_DB_PASSWORD:Fssm76GKB}
        driver-class-name: com.mysql.cj.jdbc.Driver
        maximum-pool-size: 50
        minimum-idle: 20
        connection-timeout: 30000

  defaults:
    layout: database-only

  layouts:
    database-only:
      # 属于持久化路由契约，数据产生后不要随意修改
      version: market-forge-database-v1

      # 顺序也是路由契约的一部分
      data-source-ids:
        - ds1
        - ds2

      # 每个数据库中只有一张同名物理表
      tables-per-data-source: 1

      # 这是逻辑桶数量，不代表创建 1024 张表
      bucket-count: 1024

      # 纯分库，不改写表名
      table-suffix:
        enabled: false

  tables:
    # 以下业务表统一按照 user_id 路由，同一用户的数据进入同一个数据库。
    raffle_activity_order:
      sharding-column: user_id

    raffle_activity_account:
      sharding-column: user_id

    raffle_activity_account_day:
      sharding-column: user_id

    raffle_activity_account_month:
      sharding-column: user_id

    user_award_record:
      sharding-column: user_id

    task:
      sharding-column: user_id

    user_behavior_rebate_order:
      sharding-column: user_id

    user_credit_account:
      sharding-column: user_id

    user_credit_account_order:
      sharding-column: user_id

dcc:
  enabled: true
  connect-string: ${MARKET_FORGE_ZK_CONNECT_STRING:192.168.3.127:2181}
  root-path: ${MARKET_FORGE_ZK_ROOT_PATH:/market-forge-dcc/config}
  session-timeout-ms: ${MARKET_FORGE_ZK_SESSION_TIMEOUT_MS:18000}
  connection-timeout-ms: ${MARKET_FORGE_ZK_CONNECTION_TIMEOUT_MS:30000}
  rate-limiter:
    enabled: true
    fail-open-when-capacity-exceeded: true
    local:
      max-bucket-keys: 100000
      max-reject-counter-keys: 100000
      max-blacklist-keys: 100000
resilience4j:
  circuitbreaker:
    instances:
      activity-draw:
        # 使用最近 10 次调用作为失败率统计窗口。
        sliding-window-type: count-based
        sliding-window-size: 10
        # 至少采集 5 次调用后才计算失败率，避免一次偶发异常立即熔断。
        minimum-number-of-calls: 5
        # 失败率达到 50% 时由 CLOSED 转为 OPEN。
        failure-rate-threshold: 50
        # 慢调用占比达到 50% 时也允许触发熔断。
        slow-call-rate-threshold: 50
        # 单次调用超过 2 秒即记为慢调用。
        slow-call-duration-threshold: 2s
        # OPEN 状态持续 10 秒，然后进入 HALF_OPEN 探测阶段。
        wait-duration-in-open-state: 10s
        # HALF_OPEN 状态允许 3 次探测调用。
        permitted-number-of-calls-in-half-open-state: 3
        # 无需等待新请求触发，自动从 OPEN 转换为 HALF_OPEN。
        automatic-transition-from-open-to-half-open-enabled: true
        # 参数错误、额度不足等业务异常不代表系统故障，不参与熔断统计。
        ignore-exceptions:
          - com.lavyoung.marketforge.types.exception.BusinessException

  timelimiter:
    instances:
      activity-draw:
        # 单次抽奖调用最长允许执行 5 秒。
        timeout-duration: 5s
        # 超时后尝试取消执行中的 Future。
        cancel-running-future: true

market-forge:
  thread-pool:
    enabled: true
    pools:
      message-task:
        core-pool-size: 4
        maximum-pool-size: 8
        queue-capacity: 1000
        keep-alive-seconds: 60
        await-termination-seconds: 30
        rejected-policy: caller-runs
      award-grant:
        core-pool-size: 4
        maximum-pool-size: 16
        queue-capacity: 2000
        keep-alive-seconds: 60
        await-termination-seconds: 30
        rejected-policy: abort
  elasticsearch:
    # 开发环境直接连接开发服务器，Elasticsearch 必须保持身份认证开启。
    uris:
      - ${ELASTICSEARCH_URI:http://192.168.3.127:9200}
    username: ${ELASTICSEARCH_USERNAME:elastic}
    # 密码必须通过 IDE 环境变量或启动命令注入，不在配置文件中保存。
    password: ${ELASTICSEARCH_PASSWORD:8d51VgoG3FFSxXyGcRaqjRgv}
    connect-timeout: 3s
    socket-timeout: 10s
    connection-request-timeout: 3s
  security:
    admin:
      username: ${MARKET_FORGE_ADMIN_USERNAME:admin}
      # 不提供默认值，缺少环境变量时应阻止认证模块启动。
      password-hash: ${MARKET_FORGE_ADMIN_PASSWORD_HASH}
      display-name: ${MARKET_FORGE_ADMIN_DISPLAY_NAME:系统管理员}
      authorities:
        - ROLE_ADMIN
        - ACTIVITY_ORDER_READ

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
  packages-to-scan:
    - com.lavyoung.marketforge.trigger.controller

# 监控端点
management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - circuitbreakers
          - circuitbreakerevents
  endpoint:
    health:
      probes:
        enabled: true
      # 仅开发环境展示详细组件状态，生产环境继续保持 never。
      show-details: always
    circuitbreakers:
      enabled: true
    circuitbreakerevents:
      enabled: true
    metrics:
      enabled: true
  tracing:
    enabled: true
    sampling:
      probability: 1.0
    propagation:
      type:
        - w3c


logging:
  level:
    com.lavyoung.marketforge: debug
    io.github.lavyoung.lavshard: debug
dynamic:
  thread-pool:
    config-sync-enabled: true
    application-name: ${spring.application.name}
