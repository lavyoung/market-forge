spring:
  application:
    name: market-forge

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 3s
  rabbitmq:
    addresses: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER_NAME}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: auto          # 方法正常返回=ack；抛异常=nack（交给 retry 处理）
        prefetch: 10                    # 每个消费者最多预取 10 条未确认消息
        concurrency: 2                  # 初始并发消费者数
        max-concurrency: 4              # 峰值并发
        default-requeue-rejected: false # 重试耗尽后不重回队列 —— 关键！
        retry:
          enabled: true
          max-attempts: 3               # 总共尝试 3 次（含首次）
          initial-interval: 100ms
          multiplier: 2.0
          max-interval: 10s


server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  servlet:
    session:
      cookie:
        # 生产环境必须通过 HTTPS 访问运营后台。
        secure: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  tracing:
    enabled: true
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
    propagation:
      type:
        - w3c

lavshard:
  enabled: true

  integration:
    default-data-source: ds1

    managed-mapper-packages:
      - com.lavyoung.marketforge.infrastructure.persistent.dao

    ordinary-tables:
      - award
      - strategy
      - strategy_award
      - strategy_rule
      - rule_tree
      - rule_tree_node
      - rule_tree_node_line
      - raffle_activity
      - raffle_activity_stage
      - raffle_activity_count
      - raffle_activity_sku
      - processed_message
      - behavior_rebate_config

  data-sources:
    ds1:
      managed:
        url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/market-forge-001?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}
        driver-class-name: com.mysql.cj.jdbc.Driver
        maximum-pool-size: ${DB_MAX_POOL_SIZE:20}
        minimum-idle: ${DB_MIN_IDLE:5}
        connection-timeout: 30000

    ds2:
      managed:
        url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/market-forge-002?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}
        driver-class-name: com.mysql.cj.jdbc.Driver
        maximum-pool-size: ${DB_MAX_POOL_SIZE:20}
        minimum-idle: ${DB_MIN_IDLE:5}
        connection-timeout: 30000

  defaults:
    layout: database-only

  layouts:
    database-only:
      version: market-forge-database-v1
      data-source-ids:
        - ds1
        - ds2
      tables-per-data-source: 1
      bucket-count: 1024
      table-suffix:
        enabled: false

  tables:
    raffle_activity_order:
      sharding-column: user_id

    raffle_activity_account:
      sharding-column: user_id

    raffle_activity_account_day:
      sharding-column: user_id

    raffle_activity_account_month:
      sharding-column: user_id

    user_award_record:
      sharding-column: user_id

    task:
      sharding-column: user_id

    user_behavior_rebate_order:
      sharding-column: user_id

    user_credit_account:
      sharding-column: user_id

    user_credit_account_order:
      sharding-column: user_id

dcc:
  enabled: true
  connect-string: ${MARKET_FORGE_ZK_CONNECT_STRING:192.168.3.127:2181}
  root-path: ${MARKET_FORGE_ZK_ROOT_PATH:/market-forge-dcc/config}
  session-timeout-ms: ${MARKET_FORGE_ZK_SESSION_TIMEOUT_MS:18000}
  connection-timeout-ms: ${MARKET_FORGE_ZK_CONNECTION_TIMEOUT_MS:30000}

market-forge:
  elasticsearch:
    # 生产环境不提供默认节点和凭据，缺失时应阻止应用启动。
    uris:
      - ${ELASTICSEARCH_URI}
    username: ${ELASTICSEARCH_USERNAME}
    password: ${ELASTICSEARCH_PASSWORD}
    connect-timeout: ${ELASTICSEARCH_CONNECT_TIMEOUT:3s}
    socket-timeout: ${ELASTICSEARCH_SOCKET_TIMEOUT:10s}
    connection-request-timeout: ${ELASTICSEARCH_CONNECTION_REQUEST_TIMEOUT:3s}
  security:
    admin:
      username: ${MARKET_FORGE_ADMIN_USERNAME}
      password-hash: ${MARKET_FORGE_ADMIN_PASSWORD_HASH}
      display-name: ${MARKET_FORGE_ADMIN_DISPLAY_NAME}
      authorities:
        - ROLE_ADMIN
        - ACTIVITY_ORDER_READ
