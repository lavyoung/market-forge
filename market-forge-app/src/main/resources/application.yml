spring:
  application:
    name: market-forge
  session:
    # 用户连续 30 分钟没有访问后台后，服务端会话失效。
    timeout: ${MARKET_FORGE_ADMIN_SESSION_TIMEOUT:30m}
    redis:
      # 与抽奖库存、动态配置等业务 Redis Key 隔离。
      namespace: ${MARKET_FORGE_ADMIN_SESSION_NAMESPACE:market-forge:admin:session}
      # 请求结束时统一写入 Redis，避免一次请求产生多次网络写入。
      flush-mode: on-save
      # 只有 Session 属性发生变化时才保存对应内容。
      save-mode: on-set-attribute


server:
  port: 8080
  servlet:
    session:
      cookie:
        name: MARKET_FORGE_SESSION
        http-only: true
        same-site: lax


mybatis-plus:
  mapper-locations:
    - classpath*:/mybatis/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    use-generated-keys: true
    jdbc-type-for-null: "NULL"

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: info

market-forge:
  strategy:
    snapshot:
      # 旧快照切换后继续保留一段时间，保护已经持有旧指针的在途抽奖请求。
      retirement-grace-period: ${MARKET_FORGE_SNAPSHOT_RETIREMENT_GRACE_PERIOD:10m}
      local-cache:
        # 关闭后所有概率数据直接从 Redis 读取，可用于故障回退。
        enabled: ${MARKET_FORGE_SNAPSHOT_LOCAL_CACHE_ENABLED:true}
        # 长期未访问的策略版本自动从 JVM 堆中淘汰。
        expire-after-access: ${MARKET_FORGE_SNAPSHOT_LOCAL_CACHE_EXPIRE_AFTER_ACCESS:30m}
        # 限制总权重等小型快照元数据数量。
        maximum-snapshots: ${MARKET_FORGE_SNAPSHOT_LOCAL_CACHE_MAXIMUM_SNAPSHOTS:10000}
        # 限制查找表、累计区间和 Alias 表各自缓存的元素总量。
        maximum-data-elements: ${MARKET_FORGE_SNAPSHOT_LOCAL_CACHE_MAXIMUM_DATA_ELEMENTS:100000}
    algorithm:
      # O(1) 算法允许展开的最大查找表元素数量，超过后由二分算法处理。
      direct-lookup-max-size: ${MARKET_FORGE_DIRECT_LOOKUP_MAX_SIZE:10000}
      # Alias Method 启用所需的最小候选奖品数，最终值需要结合 JMH 基线调整。
      alias-min-award-count: ${MARKET_FORGE_ALIAS_MIN_AWARD_COUNT:1000}
  thread-pool:
    enabled: true
    pools:
      message-task:
        core-pool-size: 4
        maximum-pool-size: 8
        queue-capacity: 1000
        keep-alive-seconds: 60
        await-termination-seconds: 30
        rejected-policy: caller-runs
      award-grant:
        core-pool-size: 4
        maximum-pool-size: 16
        queue-capacity: 2000
        keep-alive-seconds: 60
        await-termination-seconds: 30
        rejected-policy: abort
